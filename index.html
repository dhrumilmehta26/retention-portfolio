
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dhrumil Mehta | Spin Wheel Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: #e5b4ff;
      background-image: url('1.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      text-align: center;
    }
    .arrow {
      position: absolute;
      top: 105px;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      z-index: 10;
    }
    .spin-btn {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      cursor: pointer;
      width: 220px;
    }
    .popup {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
    .popup img {
      max-width: 90%;
      max-height: 90%;
    }
    .popup .close-btn {
      position: absolute;
      top: 30px;
      right: 50px;
      font-size: 30px;
      color: white;
      cursor: pointer;
    }
    .resume-link {
      color: gold;
      display: block;
      margin-top: 10px;
      font-size: 18px;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <img src="pointer.png" class="arrow" alt="Arrow" />
  <img src="2.png" class="spin-btn" onclick="spin()" alt="Spin Button" />

  <div class="popup" id="popup">
    <span class="close-btn" onclick="closePopup()">×</span>
    <img id="popup-img" src="" alt="Popup Content" />
    <a id="resume-download" class="resume-link" href="Dhrumil-Mehta-Resume.pdf" download style="display:none;">📥 Download Resume</a>
  </div>

  <script>
    const sections = [
      "4.png",  // Profile
      "5.png",  // Expertise
      "6.png",  // Boutiqaat
      "7.png",  // Mirraw
      "8.png",  // Education
      "9.png",  // Certifications
      "10.png", // Resume
      "12.png"  // Contact
    ];

    let currentIndex = 0;

    function spin() {
      const popup = document.getElementById("popup");
      const popupImg = document.getElementById("popup-img");
      const resumeLink = document.getElementById("resume-download");

      popupImg.src = sections[currentIndex];
      popup.style.display = "flex";

      if (sections[currentIndex] === "10.png") {
        resumeLink.style.display = "block";
      } else {
        resumeLink.style.display = "none";
      }

      currentIndex = (currentIndex + 1) % sections.length;
    }

    function closePopup() {
      document.getElementById("popup").style.display = "none";
    }
  </script>

</body>
</html>
